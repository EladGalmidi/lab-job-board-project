# ============================================================
# Frontend (React / nginx static) – Deployment + Service
# ============================================================

# ── 1. Deployment ─────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: jobboard
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/component: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: frontend
        app.kubernetes.io/name: frontend
    spec:
      # Ample time for preStop (8s) plus graceful drain before SIGKILL.
      terminationGracePeriodSeconds: 30
      containers:
        - name: frontend
          image: frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          # Hold the container open after SIGTERM so that endpoint removal has time
          # to propagate to the ingress controller and kube-proxy before the
          # process starts shutting down. Without this, a terminating pod is
          # briefly still a valid routing target: a measured rolling update
          # dropped 2 of 218 requests. maxUnavailable:0 preserves CAPACITY but
          # does not by itself prevent in-flight requests from failing.
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 8"]
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            runAsNonRoot: false   # nginx needs root to bind :80
            readOnlyRootFilesystem: false
            allowPrivilegeEscalation: false

---
# ── 2. Service (ClusterIP) ────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: jobboard
  labels:
    app.kubernetes.io/name: frontend
spec:
  selector:
    app: frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
  type: ClusterIP
