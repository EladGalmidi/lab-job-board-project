# ============================================================
# Jobs Service (Python / FastAPI) – Deployment + Service
# ============================================================

# ── 1. Deployment ─────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jobs-service
  namespace: jobboard
  labels:
    app.kubernetes.io/name: jobs-service
    app.kubernetes.io/component: api
    app.kubernetes.io/language: python
spec:
  replicas: 2
  selector:
    matchLabels:
      app: jobs-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: jobs-service
        app.kubernetes.io/name: jobs-service
    spec:
      # Wait for postgres to be resolvable before starting
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z postgres 5432; do
                echo "Waiting for postgres..."; sleep 2
              done
              echo "PostgreSQL is ready."
      # Ample time for preStop (8s) plus graceful drain before SIGKILL.
      terminationGracePeriodSeconds: 30
      containers:
        - name: jobs-service
          # For minikube: build locally with eval $(minikube docker-env)
          # For cloud:    replace with your registry image
          image: jobs-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          # Inject every key from the ConfigMap as an environment variable.
          # envFrom is used rather than five individual `env` entries so that
          # adding a key to the ConfigMap does not require editing this manifest.
          envFrom:
            - configMapRef:
                name: jobboard-config
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_DB
            # DATABASE_URL is deliberately NOT built here. Kubernetes performs
            # plain textual substitution on $(VAR) with no percent-encoding, so a
            # password generated as README-k8s.md instructs (openssl rand -base64,
            # whose alphabet includes + / =) produced a malformed URI and crashed
            # the container with ERR_INVALID_URL. The service now composes and
            # encodes the URL itself from these parts.
            - name: POSTGRES_HOST
              value: postgres
            - name: POSTGRES_PORT
              value: "5432"
          # Readiness hits /ready, which runs SELECT 1. A pod that cannot reach
          # PostgreSQL is removed from the Service endpoints instead of silently
          # continuing to receive traffic it cannot serve.
          # Hold the container open after SIGTERM so that endpoint removal has time
          # to propagate to the ingress controller and kube-proxy before the
          # process starts shutting down. Without this, a terminating pod is
          # briefly still a valid routing target: a measured rolling update
          # dropped 2 of 218 requests. maxUnavailable:0 preserves CAPACITY but
          # does not by itself prevent in-flight requests from failing.
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 8"]
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          # Liveness stays on the shallow /health. It must NOT depend on the
          # database: a liveness failure restarts the container, so a database
          # blip would become a cluster-wide restart storm.
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            readOnlyRootFilesystem: false
            allowPrivilegeEscalation: false

---
# ── 2. Service (ClusterIP) ────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: jobs-service
  namespace: jobboard
  labels:
    app.kubernetes.io/name: jobs-service
spec:
  selector:
    app: jobs-service
  ports:
    - name: http
      port: 8000
      targetPort: 8000
  type: ClusterIP
