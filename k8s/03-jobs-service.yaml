# ============================================================
# Jobs Service (Python / FastAPI) – Deployment + Service
# ============================================================

# ── 1. Deployment ─────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jobs-service
  namespace: jobboard
  labels:
    app.kubernetes.io/name: jobs-service
    app.kubernetes.io/component: api
    app.kubernetes.io/language: python
spec:
  replicas: 2
  selector:
    matchLabels:
      app: jobs-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: jobs-service
        app.kubernetes.io/name: jobs-service
    spec:
      # Wait for postgres to be resolvable before starting
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z postgres 5432; do
                echo "Waiting for postgres..."; sleep 2
              done
              echo "PostgreSQL is ready."
      containers:
        - name: jobs-service
          # For minikube: build locally with eval $(minikube docker-env)
          # For cloud:    replace with your registry image
          image: jobs-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          # Inject every key from the ConfigMap as an environment variable.
          # envFrom is used rather than five individual `env` entries so that
          # adding a key to the ConfigMap does not require editing this manifest.
          envFrom:
            - configMapRef:
                name: jobboard-config
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_DB
            # DATABASE_URL is deliberately NOT built here. Kubernetes performs
            # plain textual substitution on $(VAR) with no percent-encoding, so a
            # password generated as README-k8s.md instructs (openssl rand -base64,
            # whose alphabet includes + / =) produced a malformed URI and crashed
            # the container with ERR_INVALID_URL. The service now composes and
            # encodes the URL itself from these parts.
            - name: POSTGRES_HOST
              value: postgres
            - name: POSTGRES_PORT
              value: "5432"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            readOnlyRootFilesystem: false
            allowPrivilegeEscalation: false

---
# ── 2. Service (ClusterIP) ────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: jobs-service
  namespace: jobboard
  labels:
    app.kubernetes.io/name: jobs-service
spec:
  selector:
    app: jobs-service
  ports:
    - name: http
      port: 8000
      targetPort: 8000
  type: ClusterIP
