# ============================================================
# Kustomize – deploy the entire stack with one command:
#
#   kubectl apply -k k8s/
#
# Prerequisites:
#   1. Copy 01-secret.yaml.example → 01-secret.yaml and fill in values
#   2. Build & load images into minikube (see README-k8s.md)
# ============================================================

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: jobboard

resources:
  - 00-namespace.yaml
  # 01-secret.yaml is deliberately NOT listed here. `kubectl apply` records the
  # full object -- including the base64 password -- in the
  # kubectl.kubernetes.io/last-applied-configuration annotation, so the
  # credential ends up stored a SECOND time in etcd, in a field that is not
  # treated as sensitive and is echoed by `kubectl describe/get -o yaml`.
  # Create it imperatively instead (see README-k8s / SOLUTION-k8s.md):
  #   kubectl create secret generic postgres-secret ... --dry-run=client -o yaml   #     | kubectl apply -f - --server-side   # or: kubectl replace --force -f -
  - 02-postgres.yaml
  - 03-jobs-service.yaml
  - 04-applications-service.yaml
  - 05-frontend.yaml
  - 06-ingress.yaml
  - 07-hpa.yaml
  - 09-network-policy.yaml
  - 10-configmap.yaml

# Uncomment after all services are Running + Ready:
# - 08-seed-job.yaml

# 'commonLabels' is deprecated and, more importantly, it injects labels into
# SELECTORS as well as metadata -- which silently widened the NetworkPolicy's
# podSelector. 'labels' with includeSelectors:false adds them to metadata only.
labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: jobboard
      app.kubernetes.io/managed-by: kustomize
