events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log  warn;

    sendfile        on;
    keepalive_timeout 65;

    # ── Rate limiting ──────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;

    upstream jobs_service {
        server jobs-service:8000;
    }

    upstream applications_service {
        server applications-service:3001;
    }

    upstream frontend_service {
        server frontend:80;
    }

    server {
        listen 80;
        server_name localhost;

        # ── Security headers ───────────────────────────────────
        add_header X-Frame-Options        "SAMEORIGIN"   always;
        add_header X-Content-Type-Options "nosniff"      always;
        add_header X-XSS-Protection       "1; mode=block" always;

        # ── Content Security Policy (Task 6.2) ─────────────────
        # default-src 'self'      - everything not named below may only load from this origin
        # script-src  'self'      - scripts only from this origin: no inline <script>, no
        #                           eval, no CDNs. Vite emits external bundles, so the app
        #                           needs no inline script and this needs no relaxation.
        # style-src   'self' 'unsafe-inline'
        #                         - 'unsafe-inline' is required because React sets element
        #                           style attributes at runtime. It is the one deliberate
        #                           weakening here; a nonce- or hash-based policy would be
        #                           stricter but cannot be expressed statically.
        # img-src     'self' data: - the build inlines small images as data: URIs
        # connect-src 'self'      - XHR/fetch only back to this origin (the /api routes)
        # frame-ancestors 'none'  - nobody may frame this app: blocks clickjacking. This is
        #                           the modern replacement for X-Frame-Options and, unlike it,
        #                           is honoured when set via CSP in all current browsers.
        # object-src  'none'      - no <object>/<embed>: legacy plugin attack surface
        # base-uri    'self'      - stops injected <base> tags redirecting relative URLs
        # form-action 'self'      - forms cannot post to a third-party origin
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;

        # ── Jobs Service  (/api/jobs → jobs-service:8000/jobs) ─
        location /api/jobs {
            limit_req zone=api burst=20 nodelay;

            # Collapse the bare collection path (with or without a trailing slash)
            # onto /jobs. FastAPI declares @app.get("/jobs") without a trailing
            # slash, so rewriting /api/jobs/ -> /jobs/ made Starlette answer 307
            # to http://localhost/jobs, which nginx then matched on "location /"
            # and served the SPA as text/html instead of JSON.
            # This rule must precede the sub-path rule below.
            rewrite ^/api/jobs/?$   /jobs    break;
            rewrite ^/api/jobs/(.*) /jobs/$1 break;

            proxy_pass         http://jobs_service;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_read_timeout 30s;
        }

        # ── Applications Service (/api/applications → applications-service:3001/applications) ─
        location /api/applications {
            limit_req zone=api burst=20 nodelay;

            rewrite ^/api/applications/(.*) /applications/$1 break;
            rewrite ^/api/applications$     /applications    break;

            proxy_pass         http://applications_service;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_read_timeout 30s;
        }

        # ── Frontend (everything else) ─────────────────────────
        location / {
            proxy_pass         http://frontend_service;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        }
    }
}
