# ============================================================================
# Task 6.1 — Docker secrets overlay
#
# This is an OVERLAY, applied on top of docker-compose.yml rather than replacing
# it. The base stack is what Tasks 1-5 are graded against, and keeping the two
# separate means the secrets variant can be demonstrated without disturbing it.
#
#   Setup (db_password.txt is gitignored - never commit it):
#     echo "MyStr0ngP@ss!" > db_password.txt
#
#   Run:
#     docker compose -f docker-compose.yml -f docker-compose.secrets.yml up -d
#
#   Note this changes the PostgreSQL password, and POSTGRES_PASSWORD_FILE is only
#   read when the data directory is first initialised. Switching an existing
#   stack over therefore needs a fresh volume:
#     docker compose down -v
#
# Why bother, when the base stack already keeps the password out of git in .env?
# Because an environment variable is readable by anyone who can run
# `docker inspect <container>`, is exposed at /proc/<pid>/environ to any process
# sharing the namespace, is inherited by every child process, and tends to be
# captured verbatim by crash reporters and log aggregators. A secret is mounted
# as a file in a tmpfs, is never written to disk on the node, and is visible only
# to the containers explicitly granted it.
# ============================================================================

services:

  postgres:
    environment:
      # POSTGRES_PASSWORD is unset here so the entrypoint uses the _FILE variant.
      # The official image supports the _FILE convention for all of its
      # POSTGRES_* variables.
      POSTGRES_PASSWORD: !reset null
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password

  jobs-service:
    environment:
      # DATABASE_URL is removed so it cannot carry the password. The service
      # rebuilds the URL at startup from the secret file plus these parts —
      # see build_database_url() in jobs-service/app/database.py.
      DATABASE_URL: !reset null
      DB_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
    secrets:
      - db_password

  applications-service:
    environment:
      # Same treatment — see buildConnectionString() in
      # applications-service/src/db.js.
      DATABASE_URL: !reset null
      DB_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      PORT: 3001
    secrets:
      - db_password

# ── Secret definitions ─────────────────────────────────────────────────────
# A file-based secret. Compose mounts it read-only at /run/secrets/<name>.
# In Swarm or Kubernetes this would instead be an externally managed object;
# the consuming code does not change, because it only ever reads a file path.
secrets:
  db_password:
    file: ./db_password.txt
