server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Security headers are deliberately NOT set here. The edge proxy
    # (nginx/nginx.conf) sets them for every route, and duplicating them meant
    # X-Frame-Options and X-Content-Type-Options were returned twice on every
    # response. Setting them in exactly one place keeps the policy auditable.
}
