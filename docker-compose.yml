# Pin the Compose project name. Without it the project name is derived from the
# directory (lab-job-board), so built images would be tagged
# lab-job-board-jobs-service rather than the jobboard-* names the lab's Trivy
# commands expect.
name: jobboard

services:

  # ── PostgreSQL Database ────────────────────────────────────────
  postgres:
    # Digest-pinned for reproducibility, like the built images' base layers.
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    container_name: jobboard-db
    # ${VAR:?message} makes the variable REQUIRED: Compose aborts with the given
    # message if it is unset or empty. The original ${VAR:-default} form meant a
    # missing .env silently started the database with a weak hard-coded password
    # instead of failing, which is the opposite of what Task 2.2 asks for.
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:?POSTGRES_DB is required - copy .env.example to .env}
      POSTGRES_USER:     ${POSTGRES_USER:?POSTGRES_USER is required - copy .env.example to .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required - copy .env.example to .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      - jobboard-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M

  # ── Jobs Microservice (Python / FastAPI) ───────────────────────
  jobs-service:
    build:
      context: ./jobs-service
      dockerfile: Dockerfile
    image: jobboard-jobs-service:latest
    container_name: jobs-service
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - jobboard-network
    # 127.0.0.1 rather than localhost, matching the Dockerfile HEALTHCHECK.
    # A healthcheck here overrides the one baked into the image.
    # Probes /ready (which runs SELECT 1), not the shallow /health. This makes
    # "healthy" mean "can actually serve requests" -- previously both API
    # services reported healthy while returning 500s with postgres stopped.
    # It also makes depends_on: service_healthy meaningful for the frontend.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M

  # ── Applications Microservice (Node.js / Express) ──────────────
  applications-service:
    build:
      context: ./applications-service
      dockerfile: Dockerfile
    image: jobboard-applications-service:latest
    container_name: applications-service
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      PORT: 3001
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - jobboard-network
    # Probes /ready (SELECT 1) rather than the shallow /health -- see the
    # jobs-service healthcheck above for the rationale.
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3001/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M

  # ── React Frontend ─────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: jobboard-frontend:latest
    container_name: jobboard-frontend
    networks:
      - jobboard-network
    depends_on:
      jobs-service:
        condition: service_healthy
      applications-service:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M

  # ── Nginx Reverse Proxy (single external entry-point) ──────────
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    image: jobboard-nginx:latest
    container_name: nginx-proxy
    ports:
      - "${NGINX_PORT:-80}:80"
    depends_on:
      - frontend
      - jobs-service
      - applications-service
    networks:
      - jobboard-network
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M

# ── Named Volumes ──────────────────────────────────────────────
volumes:
  postgres-data:
    driver: local
    name: jobboard-postgres-data

# ── Networks ───────────────────────────────────────────────────
networks:
  jobboard-network:
    driver: bridge
    name: jobboard-network
